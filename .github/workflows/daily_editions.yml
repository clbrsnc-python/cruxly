name: Cruxly Twice-Daily Consolidated Editions

on:
  schedule:
    # 00:30 UTC = 06:00 AM IST (Morning Edition)
    - cron: "30 0 * * *"
    # 12:30 UTC = 06:00 PM IST (Evening Edition)
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      edition_slot:
        description: "Edition slot (morning, evening, or live)"
        required: false
        default: "morning"
      since_date:
        description: "Optional start date YYYY-MM-DD for exhaustive baseline backfill (e.g. 2026-11-15)"
        required: false
        default: ""
      exhaustive_mode:
        description: "Process all unique clusters without cap (true/false)"
        required: false
        default: "false"

jobs:
  ingest-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cruxly Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scheduled Bilingual Ingestion & Copy-Edit Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EDITION_SLOT: ${{ github.event.inputs.edition_slot }}
          SINCE_DATE: ${{ github.event.inputs.since_date }}
          EXHAUSTIVE_MODE: ${{ github.event.inputs.exhaustive_mode }}
        run: python scripts/scheduled_ingest.py
